name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shahmaat
          POSTGRES_PASSWORD: shahmaat
          POSTGRES_DB: shahmaat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shahmaat" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy shahmaat
      - name: Tests (real Postgres + Redis)
        env:
          TEST_DATABASE_URL: postgresql://shahmaat:shahmaat@localhost:5432/shahmaat_test
          TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest -q
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shahmaat:ci .
